name: MPD Radar - datos intradia

on:
  workflow_dispatch:
  schedule:   
  - cron: '9,19,29,39,49,59 13-22 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mpd-radar-pages
  cancel-in-progress: false

jobs:
  calcular-y-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preparar web
        run: |
          mkdir -p site
          cp index.html site/index.html
          cp apple-touch-icon.png favicon.png icon-512.png site/
          if [ -f pesca-data.json ]; then cp pesca-data.json site/; fi
      - name: Calcular indicadores MPD
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python update.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Publicar MPD Radar
        id: deployment
        uses: actions/deploy-pages@v4
